<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Браузер · Localis</title>
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <header class="browser-bar">
    <div class="nav-controls">
      <button id="back" class="nav-button" aria-label="Назад" title="Назад">‹</button>
      <button id="forward" class="nav-button" aria-label="Вперёд" title="Вперёд">›</button>
      <button id="reload" class="nav-button reload" aria-label="Обновить" title="Обновить">↻</button>
    </div>
    <form id="address-form" class="address-form">
      <span class="lock" aria-hidden="true">⌁</span>
      <input id="address" type="text" autocomplete="url" spellcheck="false" aria-label="Адрес сайта" placeholder="Введите адрес или поисковый запрос">
      <button type="submit" class="go-button">Перейти</button>
    </form>
    <button id="search" class="search-button" title="Поиск в DuckDuckGo">Поиск</button>
  </header>
  <div id="page-state" class="page-state"><span class="state-dot"></span><span id="state-label">Подключение…</span><button id="external" type="button">Открыть на сайте ↗</button></div>
  <main aria-hidden="true"></main>
  <script src="browser.js"></script>
</body>
</html>

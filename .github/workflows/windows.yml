name: Windows desktop build

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath test-results.txt
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            Get-Content test-results.txt | Select-String -Pattern 'not ok|AssertionError|Error:|ERR_|failed|expected|actual' | Select-Object -First 20 | ForEach-Object { Write-Output "::error title=Windows test failure::$($_.Line)" }
            exit $testExitCode
          }
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Localis-test-log
          path: test-results.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath build-results.txt
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            Get-Content build-results.txt | Select-String -Pattern 'ERR|error|Error|failed|ENOENT|Cannot|Exception|not found' | Select-Object -Last 25 | ForEach-Object { Write-Output "::error title=Windows packaging failure::$($_.Line)" }
            exit $buildExitCode
          }
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Localis-build-log
          path: build-results.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Localis-Windows
          path: release/Localis-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
